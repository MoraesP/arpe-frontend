<section class="listagem">
  <h1>Catálogo</h1>

  <div class="filtros">
    <input
      type="search"
      placeholder="Buscar por nome..."
      [ngModel]="busca()"
      (ngModelChange)="busca.set($event)"
    />

    <select [ngModel]="tagSelecionada()" (ngModelChange)="tagSelecionada.set($event)">
      <option value="">Todas as tags</option>
      @for (tag of tags(); track tag.id) {
        <option [value]="tag.name">{{ tag.name }}</option>
      }
    </select>

    <select [ngModel]="ordenar()" (ngModelChange)="ordenar.set($event)">
      <option value="desc">Mais recentes</option>
      <option value="asc">Mais antigos</option>
    </select>
  </div>

  @if (produtos(); as lista) {
    @if (lista.length === 0) {
      <p class="vazio">Nenhum produto encontrado.</p>
    } @else {
      <div class="grid">
        @for (produto of lista; track produto.id) {
          <app-produto-card [produto]="produto" />
        }
      </div>
    }
  } @else {
    <div class="grid" role="status" aria-label="Carregando produtos">
      @for (item of skeletonItems; track item) {
        <app-skeleton-card />
      }
    </div>
  }
</section>
